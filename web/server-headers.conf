# JavaBox required HTTP headers
#
# SharedArrayBuffer (required by QEMU Wasm / Emscripten) is only available
# in Cross-Origin Isolated contexts. Both headers below are mandatory.
#
# Without these headers, the container will fail with:
#   "SharedArrayBuffer is not defined"
#
# -------------------------------------------------------------------
# Apache (.htaccess or VirtualHost)
# -------------------------------------------------------------------
# Header set Cross-Origin-Opener-Policy "same-origin"
# Header set Cross-Origin-Embedder-Policy "require-corp"

# -------------------------------------------------------------------
# Nginx
# -------------------------------------------------------------------
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Embedder-Policy "require-corp" always;

# -------------------------------------------------------------------
# Caddy (Caddyfile)
# -------------------------------------------------------------------
# header {
#     Cross-Origin-Opener-Policy "same-origin"
#     Cross-Origin-Embedder-Policy "require-corp"
# }

# -------------------------------------------------------------------
# Cloudflare Workers / Pages (headers file)
# -------------------------------------------------------------------
# /*
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp

# -------------------------------------------------------------------
# serve (npx serve) — see build/serve-config.json
# -------------------------------------------------------------------
# npx serve ./htdocs --config ./build/serve-config.json

# -------------------------------------------------------------------
# Vite (vite.config.ts)
# -------------------------------------------------------------------
# server: {
#   headers: {
#     'Cross-Origin-Opener-Policy': 'same-origin',
#     'Cross-Origin-Embedder-Policy': 'require-corp',
#   },
# },
