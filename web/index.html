<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JavaBox</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" crossorigin="anonymous" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }
    #header { padding: 6px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #header h1 { font-size: 14px; font-weight: 600; }
    #status { font-size: 11px; padding: 2px 8px; border-radius: 3px; background: #3c3c3c; }
    #status.booting { background: #856404; color: #fff; }
    #status.ready   { background: #155724; color: #fff; }
    #status.error   { background: #721c24; color: #fff; }
    #filename { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 2px 6px; font-family: monospace; font-size: 12px; border-radius: 3px; width: 180px; }
    #compile-run { background: #0e639c; color: #fff; border: none; padding: 4px 14px; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 12px; font-weight: 600; }
    #compile-run:hover:not(:disabled) { background: #1177bb; }
    #compile-run:disabled { background: #555; cursor: not-allowed; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #editor-panel { width: 45%; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; }
    #editor-toolbar { padding: 4px 8px; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; font-size: 11px; color: #888; }
    #code-editor { flex: 1; resize: none; background: #1e1e1e; color: #d4d4d4; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; line-height: 1.5; padding: 8px; border: none; outline: none; tab-size: 4; white-space: pre; overflow: auto; }
    #terminal-panel { width: 55%; display: flex; flex-direction: column; }
    #terminal-toolbar { padding: 4px 8px; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; font-size: 11px; color: #888; }
    #terminal { flex: 1; overflow: hidden; }
    .xterm { height: 100%; padding: 4px; }
    .xterm-viewport { overflow-y: auto !important; }

    /* Boot overlay */
    #boot-progress {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #252526; border: 1px solid #3c3c3c; border-radius: 8px;
      padding: 24px 32px; text-align: center; min-width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 10;
    }
    #boot-progress h2 { font-size: 16px; margin-bottom: 8px; }
    #boot-progress p { color: #888; font-size: 12px; margin-bottom: 16px; }
    .progress-bar { width: 100%; height: 3px; background: #3c3c3c; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0e639c; border-radius: 2px; width: 0%; transition: width 0.3s; }
    #boot-stage { margin-top: 8px; font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <div id="header">
    <h1>JavaBox</h1>
    <input id="filename" value="HelloWorld.java" />
    <button id="compile-run" disabled>Booting...</button>
    <span id="status" class="booting">Loading...</span>
  </div>
  <div id="main">
    <div id="editor-panel">
      <div id="editor-toolbar">Editor</div>
      <textarea id="code-editor" spellcheck="false">public class HelloWorld {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}
</textarea>
    </div>
    <div id="terminal-panel">
      <div id="terminal-toolbar">Terminal</div>
      <div id="terminal"></div>
    </div>
  </div>

  <!-- Boot progress overlay -->
  <div id="boot-progress">
    <h2>Starting JavaBox</h2>
    <p>Loading JDK 21 directly in your browser.<br>This takes 3&#x2013;5 seconds.</p>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="boot-stage">Loading WASM...</div>
  </div>

  <!-- xterm.js (no xterm-pty needed for direct WASM mode) -->
  <script src="xterm.js"></script>

  <script>
    const statusEl   = document.getElementById('status');
    const termDiv    = document.getElementById('terminal');
    const compileBtn = document.getElementById('compile-run');
    const filenameEl = document.getElementById('filename');
    const editorEl   = document.getElementById('code-editor');
    const bootProgress = document.getElementById('boot-progress');
    const progressFill = document.getElementById('progress-fill');
    const bootStage    = document.getElementById('boot-stage');

    function setProgress(percent, stage) {
      progressFill.style.width = percent + '%';
      bootStage.textContent = stage;
    }

    // ── Cross-Origin Isolation guard ──────────────────────────────────────────
    if (!crossOriginIsolated) {
      bootProgress.innerHTML = `
        <h2>Missing Required Headers</h2>
        <p>JavaBox requires Cross-Origin Isolation (SharedArrayBuffer).<br>
        Server must send:</p>
        <pre style="text-align:left;background:#1e1e1e;padding:8px;border-radius:4px;margin-top:8px;font-size:11px">
Cross-Origin-Opener-Policy: same-origin
Cross-Origin-Embedder-Policy: require-corp</pre>
        <p style="margin-top:8px;font-size:11px">Serve with: <code>python3 build/serve.py build/www</code></p>
      `;
      statusEl.textContent = 'Error';
      statusEl.className = 'error';
      throw new Error('Cross-Origin Isolation required');
    }

    // ── xterm.js terminal ─────────────────────────────────────────────────────
    const term = new Terminal({
      cursorBlink: true,
      scrollback: 5000,
      cols: 90,
      rows: 30,
      fontSize: 13,
      fontFamily: "'Menlo', 'Consolas', monospace",
      theme: { background: '#1e1e1e' },
    });
    term.open(termDiv);

    // ── PTY output tracking ─────────────────────────────────────────────────
    window._ptyWriteCount = 0;
    window._ptyTotalBytes = 0;
    window._ptyRecentText = '';
    window._bootPhase = 'booting';
    window._compileDone = false;

    // sendToGuest — placeholder, overridden once direct WASM module loads
    window.sendToGuest = function(raw) {
      console.warn('[sendToGuest] Module not initialized yet');
    };

    function enableCompile() {
      compileBtn.disabled = false;
      compileBtn.textContent = '\u25b6 Compile & Run';
      statusEl.textContent = 'Ready';
      statusEl.className = 'ready';
      console.log('[BOOT] Compile enabled');
    }

    compileBtn.disabled = true;

    // ── Compile & Run button ─────────────────────────────────────────────────
    compileBtn.addEventListener('click', () => {
      if (window._bootPhase !== 'ready') {
        console.log('[COMPILE] Not ready (phase=' + window._bootPhase + ')');
        return;
      }
      window._compileDone = false;
      window._ptyRecentText = '';
      term.clear();

      compileBtn.disabled = true;
      compileBtn.textContent = 'Running...';
      statusEl.textContent = 'Running...';
      statusEl.className = 'booting';

      const source = editorEl.value;
      const classMatch = source.match(/class\s+(\w+)/);
      const className = classMatch ? classMatch[1] : 'Main';
      const compileStart = Date.now();

      // Send compile command to CompileServer via stdin protocol
      const cmd = 'JBOX_COMPILE ' + className + '\n' + source + '\nJBOX_END\n';
      window.sendToGuest(cmd);
      console.log('[COMPILE] Sent (' + cmd.length + ' chars, class=' + className + ')');

      // Watch for JBOX_EXIT:<code> from CompileServer
      const watcher = setInterval(() => {
        const elapsed = Math.round((Date.now() - compileStart) / 1000);
        statusEl.textContent = 'Running... ' + elapsed + 's';

        const exitMatch = (window._ptyRecentText || '').match(/JBOX_EXIT:(\d+)/);
        if (exitMatch) {
          clearInterval(watcher);
          const exitCode = parseInt(exitMatch[1]);
          window._compileDone = true;
          compileBtn.disabled = false;
          compileBtn.textContent = '\u25b6 Compile & Run';
          if (exitCode === 0) {
            statusEl.textContent = 'Done';
            statusEl.className = 'ready';
          } else {
            statusEl.textContent = 'Error (exit ' + exitCode + ')';
            statusEl.className = 'error';
          }
          console.log('[COMPILE] Done in ' + elapsed + 's, exit=' + exitCode);
        }
      }, 500);

      // Timeout: 60s (direct WASM is much faster than QEMU)
      setTimeout(() => {
        if (!window._compileDone) {
          clearInterval(watcher);
          window._compileDone = true;
          compileBtn.disabled = false;
          compileBtn.textContent = '\u25b6 Compile & Run';
          statusEl.textContent = 'Timed out';
          statusEl.className = 'error';
        }
      }, 60000);
    });

    // ── Tab key in editor ────────────────────────────────────────────────────
    editorEl.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editorEl.selectionStart;
        const end   = editorEl.selectionEnd;
        editorEl.value = editorEl.value.substring(0, start) + '    ' + editorEl.value.substring(end);
        editorEl.selectionStart = editorEl.selectionEnd = start + 4;
      }
    });

    statusEl.textContent = 'Loading...';
    statusEl.className = 'booting';
    setProgress(10, 'Loading data file...');
  </script>

  <script type="module">
    if (!crossOriginIsolated) throw new Error('COI required');

    // ── Direct WASM bootstrap ─────────────────────────────────────────────────
    try {
      setProgress(20, 'Streaming WASM compilation...');
      const wasmPromise = WebAssembly.compileStreaming(fetch('./javabox-direct.wasm'));

      setProgress(30, 'Loading JVM module...');
      const { default: createModule } = await import('./javabox-direct.mjs');

      const directModule = {
        print(text) {
          // Track all output for boot detection and tests
          window._ptyWriteCount++;
          window._ptyTotalBytes += text.length;
          window._ptyRecentText = ((window._ptyRecentText || '') + text + '\n').slice(-8000);
          // Filter out protocol messages from terminal display
          if (/^JBOX_(PONG|EXIT:\d+|COMPILE|END|PING|DOOM)/.test(text)) return;
          if (/^={5,}/.test(text)) return;
          term.write(text + '\r\n');
        },
        printErr(text) {
          // Filter JVM internal thread errors from terminal display
          if (/^Exception in thread "(Finalizer|Common-Cleaner|DoomLoop|Reference Handler)"/.test(text)) return;
          if (text === 'java.lang.NullPointerException') return;
          term.write('\x1b[31m' + text + '\x1b[0m\r\n');
        },
        onExit(code) {
          bootProgress.style.display = 'none';
          statusEl.textContent = 'Exited (' + code + ')';
          statusEl.className = code === 0 ? 'ready' : 'error';
        },
      };

      setProgress(50, 'Waiting for WASM compilation...');
      const compiledWasm = await wasmPromise;

      directModule.instantiateWasm = function(imports, callback) {
        WebAssembly.instantiate(compiledWasm, imports).then(instance => {
          callback(instance, compiledWasm);
        });
        return {};
      };

      setProgress(60, 'Initializing JVM...');
      const Module = await createModule(directModule);
      window._directModule = Module;

      // Enable ring buffer stdin
      Module.ccall('jvm_enable_ring_buffer_stdin', null, [], []);

      // Override sendToGuest — use ring buffer bridge
      window.sendToGuest = function(raw) {
        Module.ccall('jvm_stdin_write_string', null, ['string'], [raw]);
      };

      setProgress(90, 'Waiting for CompileServer...');
      bootProgress.style.display = 'none';
      statusEl.textContent = 'Booting...';
      statusEl.className = 'booting';
      window._bootPhase = 'booting';

      // Poll for JBOX_PONG (CompileServer ready)
      const start = Date.now();
      const pingInterval = setInterval(() => {
        window.sendToGuest('JBOX_PING\n');
      }, 2000);

      const checkBoot = setInterval(() => {
        const text = window._ptyRecentText || '';
        if (text.includes('JBOX_PONG')) {
          clearInterval(checkBoot);
          clearInterval(pingInterval);
          window._bootPhase = 'ready';
          enableCompile();
          console.log('[JavaBox] CompileServer ready');
        }
        if (Date.now() - start > 60000) {
          clearInterval(checkBoot);
          clearInterval(pingInterval);
          statusEl.textContent = 'Boot timeout';
          statusEl.className = 'error';
        }
      }, 500);

    } catch (err) {
      bootProgress.style.display = 'none';
      statusEl.textContent = 'Error';
      statusEl.className = 'error';
      console.error('[JavaBox] boot error:', err);
    }
  </script>
</body>
</html>
