# JavaBox Doom - Terminal-only keyboard config
# Mouse and sound disabled for headless WASM terminal mode

mouse_sensitivity 0
sfx_volume 0
music_volume 0
show_messages 1
screenblocks 10

# Keyboard bindings — values are ScanCode ordinals matching TerminalInput
# (G_Responder sets gamekeydown[sc.ordinal()], BuildTiccmd reads gamekeydown[key_*])
key_right 106
key_left 105
key_up 103
key_down 108
key_strafeleft 51
key_straferight 52
key_fire 29
key_use 57
key_strafe 42
key_speed 42

use_mouse 0
mouseb_fire -1
mouseb_strafe -1
mouseb_forward -1
mouse_sensitivity 0

use_joystick 0

snd_channels 0
snd_musicdevice 0
snd_sfxdevice 0
